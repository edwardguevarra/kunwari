<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunwari</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/apps.css">
</head>
<body>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-logo">💼</div>
    <h1>Kunwari</h1>
    <p>Kunwaring may ginagawa. An infinite loop of extremely important work.</p>
    <div class="boot-opts">
      <label class="opt"><span>Switch apps every</span>
        <select id="opt-interval">
          <option value="20000">20 seconds</option>
          <option value="35000" selected>35 seconds</option>
          <option value="60000">1 minute</option>
          <option value="120000">2 minutes</option>
          <option value="0">Never (manual)</option>
        </select>
      </label>
      <label class="opt"><span>Speed</span>
        <select id="opt-speed">
          <option value="1.6">Chill</option>
          <option value="1" selected>Normal</option>
          <option value="0.6">Caffeinated</option>
        </select>
      </label>
      <label class="opt check"><input type="checkbox" id="opt-cursor" checked><span>Show ghost cursor</span></label>
      <label class="opt check"><input type="checkbox" id="opt-notif" checked><span>Random notifications</span></label>
    </div>

    <button id="cfg-toggle" class="cfg-toggle">Customise workspace  ▸</button>
    <div id="cfg-box" class="cfg-box" hidden>
      <label class="cfg-row"><span>Company</span><input id="cfg-company" spellcheck="false"></label>
      <label class="cfg-row"><span>Your name</span><input id="cfg-me" spellcheck="false"></label>
      <label class="cfg-row"><span>Email domain</span><input id="cfg-domain" spellcheck="false"></label>
      <label class="cfg-row"><span>Repo</span><input id="cfg-repo" spellcheck="false"></label>
      <label class="cfg-row"><span>Branch</span><input id="cfg-branch" spellcheck="false"></label>
      <label class="cfg-row"><span>Project</span><input id="cfg-project" spellcheck="false"></label>
      <label class="cfg-row"><span>Figma file</span><input id="cfg-file" spellcheck="false"></label>
      <label class="cfg-row"><span>Dashboard</span><input id="cfg-dash" spellcheck="false"></label>
      <label class="cfg-row col"><span>Teammates — one per line</span>
        <textarea id="cfg-team" rows="6" spellcheck="false"></textarea></label>
      <button id="cfg-reset" class="cfg-reset">Reset to defaults</button>
    </div>
    <button id="boot-go">Start working</button>
    <div class="boot-hint">Press <kbd>F</kbd> for fullscreen · <kbd>1</kbd>–<kbd>6</kbd> to switch app · <kbd>space</kbd> pause · <kbd>esc</kbd> menu</div>
  </div>
</div>

<div id="desk" hidden>
  <div id="menubar">
    <div class="mb-left">
      <span class="mb-apple"><svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M17.05 12.9c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.1-2.02-3.77-2.05-1.6-.16-3.13.94-3.94.94-.81 0-2.07-.92-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.81 3.15-.46 7.8 1.3 10.35.86 1.25 1.89 2.65 3.23 2.6 1.3-.05 1.79-.84 3.36-.84s2.01.84 3.38.81c1.4-.02 2.28-1.27 3.13-2.53.99-1.45 1.4-2.85 1.42-2.92-.03-.01-2.72-1.04-2.75-4.13M14.5 5.3c.72-.87 1.2-2.08 1.07-3.3-1.03.04-2.28.69-3.02 1.56-.66.77-1.24 2-1.09 3.18 1.15.09 2.32-.58 3.04-1.44"/></svg></span>
      <b class="mb-name">Finder</b>
      <span class="mb-menus"></span>
    </div>
    <div class="mb-right">
      <span class="mb-i mb-batt"><svg viewBox="0 0 30 14" width="26" height="13"><rect x=".5" y=".5" width="24" height="13" rx="4" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="18" height="9" rx="2.2" fill="currentColor"/><path d="M26.5 5v4c1.1-.3 1.7-1 1.7-2s-.6-1.7-1.7-2z" fill="currentColor" opacity=".5"/></svg></span>
      <span class="mb-i"><svg viewBox="0 0 20 14" width="17" height="12"><path fill="currentColor" d="M10 12.6 12.4 9.9a3.4 3.4 0 0 0-4.8 0zM10 6.5c1.5 0 2.9.6 4 1.6l1.5-1.7A8.2 8.2 0 0 0 10 4.3c-2.1 0-4 .8-5.5 2.1L6 8.1a5.9 5.9 0 0 1 4-1.6M10 1.4c2.9 0 5.5 1.1 7.5 2.9l1.5-1.7A13.2 13.2 0 0 0 10-.8C6.4-.8 3.1.5.9 2.6l1.6 1.7A11 11 0 0 1 10 1.4"/></svg></span>
      <span class="mb-i"><svg viewBox="0 0 20 20" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M8.6 15.2a6.6 6.6 0 1 0 0-13.2 6.6 6.6 0 0 0 0 13.2zm4.8-1.5 4.4 4.4"/></svg></span>
      <span class="mb-i"><svg viewBox="0 0 22 16" width="17" height="13"><rect x="1" y="1" width="9" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4" cy="4" r="1.6" fill="currentColor"/><rect x="12" y="9" width="9" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg></span>
      <span class="mb-clock" id="mb-clock"></span>
    </div>
  </div>

  <div id="desktop">
    <div id="screen"></div>
    <div id="ghost-cursor"><svg viewBox="-1 -1 15 21" width="16" height="22"><path d="M0 0v16.5l4.2-3.9 2.8 5.7 2.6-1.3-2.7-5.4 5.1-.2z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg></div>
    <div id="notifs"></div>
  </div>

  <div id="dock-wrap"><div id="dock"></div></div>
</div>

<div id="menu" hidden>
  <div class="menu-card">
    <h2>Paused</h2>
    <div class="menu-row"><button data-act="resume">Resume</button><button data-act="fs">Fullscreen</button></div>
    <div class="menu-row"><button data-act="restart">Back to setup</button></div>
    <p class="menu-note">Nothing here is real. No data leaves this page.</p>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/apps/vscode.js"></script>
<script src="js/apps/linear.js"></script>
<script src="js/apps/roam.js"></script>
<script src="js/apps/figma.js"></script>
<script src="js/apps/posthog.js"></script>
<script src="js/apps/gmail.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
