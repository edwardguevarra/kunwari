# Cuts a release whenever a v* tag is pushed, so nobody needs a Go toolchain
# locally to ship one:  git tag v1.1.0 && git push origin v1.1.0
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build every target
        run: tools/build-release.sh "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME — Kunwari" \
            --generate-notes
